<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" role="img" aria-label="Mission Control Architecture">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="920" height="330" rx="14" fill="#0e1014"/>
  <rect x="0.5" y="0.5" width="919" height="329" rx="13.5" fill="none" stroke="rgba(255,255,255,0.10)"/>

  <!-- Header -->
  <text x="26" y="34" fill="#eceef2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Mission Control Architecture</text>
  <text x="894" y="34" text-anchor="end" fill="#747c8c" font-family="ui-monospace, Menlo, monospace" font-size="11">Zero public ports · Local SQLite + Tailnet HTTPS</text>

  <!-- Node 1: Antigravity Desktop Plugin -->
  <g transform="translate(24,54)">
    <rect width="264" height="176" rx="10" fill="#15181f" stroke="rgba(56,189,248,0.35)" stroke-width="1.2"/>
    <circle cx="18" cy="22" r="4.5" fill="#38bdf8"/>
    <text x="30" y="26" fill="#eceef2" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="650">Antigravity MCP App</text>
    <text x="16" y="46" fill="#747c8c" font-family="ui-monospace, Menlo, monospace" font-size="10.5">dist/server.mjs · dist/app.html</text>

    <rect x="14" y="60" width="236" height="24" rx="5" fill="#1d222b"/>
    <text x="24" y="76" fill="#eceef2" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Pictorial Board &amp; Step Gauges</text>

    <rect x="14" y="90" width="236" height="24" rx="5" fill="#1d222b"/>
    <text x="24" y="106" fill="#eceef2" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">AI Commander (Auto · Flash · Carbon)</text>

    <rect x="14" y="120" width="236" height="24" rx="5" fill="#1d222b"/>
    <text x="24" y="136" fill="#eceef2" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Turn-Aware Flash Briefings + Next Pills</text>

    <text x="16" y="164" fill="#a3aab8" font-family="ui-monospace, Menlo, monospace" font-size="10">⌘K Palette · / Find · ? Shortcuts HUD</text>
  </g>

  <!-- Arrow 1 <-> 2 -->
  <line x1="292" y1="142" x2="326" y2="142" stroke="#38bdf8" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Node 2: Companion API + Peer Mesh -->
  <g transform="translate(330,54)">
    <rect width="260" height="176" rx="10" fill="#15181f" stroke="rgba(52,211,153,0.35)" stroke-width="1.2"/>
    <circle cx="18" cy="22" r="4.5" fill="#34d399"/>
    <text x="30" y="26" fill="#eceef2" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="650">Companion Daemon</text>
    <text x="16" y="46" fill="#747c8c" font-family="ui-monospace, Menlo, monospace" font-size="10.5">127.0.0.1:8696 → tailscale serve</text>

    <rect x="14" y="60" width="232" height="24" rx="5" fill="#1d222b"/>
    <text x="24" y="76" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Bearer Auth · timingSafeEqual</text>

    <rect x="14" y="90" width="232" height="24" rx="5" fill="#1d222b"/>
    <text x="24" y="106" fill="#eceef2" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Multi-Mac Peer Proxy (?localOnly=1)</text>

    <rect x="14" y="120" width="232" height="24" rx="5" fill="#1d222b"/>
    <text x="24" y="136" fill="#eceef2" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Agent Relay + Guarded Auto-Wake</text>

    <text x="16" y="164" fill="#a3aab8" font-family="ui-monospace, Menlo, monospace" font-size="10">/v1/board · /v1/ai/* · /v1/relays/*</text>
  </g>

  <!-- Arrow 2 <-> 3 -->
  <line x1="594" y1="142" x2="628" y2="142" stroke="#34d399" stroke-width="1.6" marker-start="url(#arrow-emerald)" marker-end="url(#arrow-emerald)"/>

  <!-- Node 3: Native iPhone Companion -->
  <g transform="translate(632,54)">
    <rect width="264" height="176" rx="10" fill="#15181f" stroke="rgba(245,158,11,0.35)" stroke-width="1.2"/>
    <circle cx="18" cy="22" r="4.5" fill="#f59e0b"/>
    <text x="30" y="26" fill="#eceef2" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="650">iOS Companion App</text>
    <text x="16" y="46" fill="#747c8c" font-family="ui-monospace, Menlo, monospace" font-size="10.5">Primary + Fallback Failover</text>

    <rect x="14" y="60" width="236" height="24" rx="5" fill="#1d222b"/>
    <text x="24" y="76" fill="#eceef2" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">AI Commander + Confirm Cards</text>

    <rect x="14" y="90" width="236" height="24" rx="5" fill="#1d222b"/>
    <text x="24" y="106" fill="#eceef2" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Remote Thread Triage &amp; Relays</text>

    <rect x="14" y="120" width="236" height="24" rx="5" fill="#1d222b"/>
    <text x="24" y="136" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Keychain Secrets + Face ID Gate</text>

    <text x="16" y="164" fill="#a3aab8" font-family="ui-monospace, Menlo, monospace" font-size="10">SwiftUI · AppIntents · Widgets</text>
  </g>

  <!-- Bottom Row: Peer Mac + CLI Table -->
  <line x1="460" y1="234" x2="460" y2="254" stroke="#f59e0b" stroke-width="1.5" marker-start="url(#arrow-amber)" marker-end="url(#arrow-amber)"/>

  <g transform="translate(24,258)">
    <rect width="264" height="50" rx="8" fill="#15181f" stroke="rgba(255,255,255,0.08)"/>
    <text x="16" y="21" fill="#eceef2" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600">Antigravity Local Store &amp; CLI</text>
    <text x="16" y="38" fill="#a3aab8" font-family="ui-monospace, Menlo, monospace" font-size="10">SQLite state · bin/agy-status · agy -p</text>
  </g>

  <g transform="translate(330,258)">
    <rect width="260" height="50" rx="8" fill="#15181f" stroke="rgba(255,255,255,0.08)"/>
    <text x="16" y="21" fill="#eceef2" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600">Secondary Peer Macs</text>
    <text x="16" y="38" fill="#a3aab8" font-family="ui-monospace, Menlo, monospace" font-size="10">~/.config/agy-control/peers.json</text>
  </g>

  <g transform="translate(632,258)">
    <rect width="264" height="50" rx="8" fill="#15181f" stroke="rgba(255,255,255,0.08)"/>
    <text x="16" y="21" fill="#eceef2" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600">Optional Fleet Bridge</text>
    <text x="16" y="38" fill="#a3aab8" font-family="ui-monospace, Menlo, monospace" font-size="10">~/.config/agy-control/fleet.json</text>
  </g>
</svg>
